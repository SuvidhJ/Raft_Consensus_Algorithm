syntax = "proto3";
package proto;
option go_package = "github.com/SuvidhJ/Raft_Consensus_Algorithm/proto";

service RaftService {
  rpc PreVote(PreVoteRequest) returns (PreVoteResponse);
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
  rpc TimeoutNow(TimeoutNowRequest) returns (TimeoutNowResponse);

  // Cluster administration.
  rpc AddServer(AddServerRequest) returns (AddServerResponse);
  rpc RemoveServer(RemoveServerRequest) returns (RemoveServerResponse);
  rpc ClusterStatus(ClusterStatusRequest) returns (ClusterStatusResponse);
}

enum EntryType {
  ENTRY_NORMAL = 0;
  ENTRY_CONFIG = 1;
}

message LogEntry {
  uint64 term = 1;
  string command = 2; // legacy string command ("INIT" or "SETB64 ..."); empty for typed payloads
  uint64 index = 3;
  bytes payload = 4;     // marshaled Command (normal) or ClusterConfig (config entry)
  EntryType type = 5;
}

// Command is the typed state-machine operation carried in LogEntry.payload.
message Command {
  enum Type {
    TYPE_UNKNOWN = 0;
    TYPE_SET = 1;
    TYPE_DELETE = 2;
    TYPE_CAS = 3;
  }
  Type type = 1;
  string key = 2;
  string value = 3;
  string expected_value = 4;
  bool expect_absent = 5;
  // Client session identity for exactly-once semantics. A retried command
  // with the same (client_id, sequence) is applied at most once.
  uint64 client_id = 6;
  uint64 sequence = 7;
}

// ClusterConfig is the full membership list carried by ENTRY_CONFIG entries
// and snapshots. Members are identified by their advertised address.
message ClusterConfig {
  repeated string members = 1;
}

message RequestVoteRequest {
  uint64 term = 1;
  uint32 candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

message PreVoteRequest {
  uint64 term = 1;
  uint32 candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message PreVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

message AppendEntriesRequest {
  uint64 term = 1;
  uint32 leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  uint64 leader_commit = 6;
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  uint64 conflict_index = 3;
  uint64 conflict_term = 4;
  bool need_snapshot = 5;
}

message InstallSnapshotRequest {
  uint64 term = 1;
  uint32 leader_id = 2;
  uint64 last_included_index = 3;
  uint64 last_included_term = 4;
  bytes data = 5;
  ClusterConfig config = 6; // membership at last_included_index
}

message InstallSnapshotResponse {
  uint64 term = 1;
  bool success = 2;
}

message TimeoutNowRequest {
  uint64 term = 1;
  uint32 leader_id = 2;
}

message TimeoutNowResponse {
  uint64 term = 1;
  bool success = 2;
}

message AddServerRequest {
  string address = 1;
}

message AddServerResponse {
  bool success = 1;
  string error_message = 2;
  uint32 leader_id = 3; // hint when this node is not the leader
}

message RemoveServerRequest {
  string address = 1;
}

message RemoveServerResponse {
  bool success = 1;
  string error_message = 2;
  uint32 leader_id = 3;
}

message ClusterStatusRequest {}

message ClusterStatusResponse {
  uint32 node_id = 1;
  string state = 2;
  uint64 term = 3;
  uint32 leader_id = 4;
  uint64 commit_index = 5;
  uint64 applied_index = 6;
  uint64 last_log_index = 7;
  uint64 last_log_term = 8;
  uint64 snapshot_index = 9;
  repeated string members = 10; // active configuration (advertised addresses)
}
